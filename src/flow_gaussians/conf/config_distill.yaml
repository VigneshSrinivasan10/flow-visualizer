# Distillation configuration for flow matching on 2D Gaussians
# The student model learns to predict CFG-combined velocity in a single forward pass

data:
  # Dataset type: overlapping, non_overlapping, multimodal
  dataset: overlapping
  n_samples: 5000

model:
  hidden_dim: 128

training:
  seed: 42
  epochs: 500
  batch_size: 128
  learning_rate: 0.0005
  label_dropout: 0.3
  log_interval: 50
  force_retrain: false
  output_dir: outputs/flow_gaussians/${data.dataset}

distillation:
  epochs: 200
  batch_size: 256
  learning_rate: 0.0005
  w_min: 0.0
  w_max: 10.0
  n_samples_per_epoch: 10000
  log_interval: 20
  force_retrain: false
  teacher_dir: outputs/flow_gaussians/${data.dataset}
  output_dir: outputs/flow_gaussians/${data.dataset}/distilled

visualization:
  n_samples: 500
  guidance_scales: [0, 1, 3, 5, 7, 9]
  animation_guidance_scales: [1, 5, 9]
  animation_n_samples: 500
  animation_num_steps: 50
  animation_fps: 15
